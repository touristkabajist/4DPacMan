# Build the Vite game in 4dPacMan/ and publish it to GitHub Pages:
# https://touristkabajist.github.io/4DPacMan/
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push replaces a queued one but never cancels a running deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 4dPacMan
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: 4dPacMan/package-lock.json

      - run: npm ci
      # Unit tests (levels, obstacles, 4D maths) gate the deploy.
      - run: npm test
      # tsc --noEmit && vite build → 4dPacMan/dist (vite base is './', so assets resolve under /4DPacMan/).
      - run: npm run build

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: 4dPacMan/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
